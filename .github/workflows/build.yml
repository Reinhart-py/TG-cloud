name: MIKA Production Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Run Obfuscation Protocol
      run: node build.js

    - name: Compress Payload
      run: |
        cd dist
        zip -r ../mika-god-mode.zip .
        cd ..

    - name: Publish Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: MIKA - Latest Build
        body: "Automated build. Download mika-god-mode.zip below."
        files: mika-god-mode.zip
        draft: false
        prerelease: false
        allow_updates: true
        make_latest: true
        token: ${{ secrets.MY_PAT }}
